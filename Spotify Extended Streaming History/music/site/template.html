<title>履歴盤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #ecebe8;
  --surface: #f7f6f4;
  --surface-2: #dfddd8;
  --line: #cfccc5;
  --ink: #17161a;
  --ink-2: #48464e;
  --ink-3: #75727c;
  --acc-l: #d98a1e; --acc-d: #f0a640;
  --accent: var(--acc-l);
  --accent-soft: color-mix(in srgb, var(--accent) 22%, var(--surface));
  --on-accent: #ffffff;
  --scope-bg: #17161a;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111013; --surface: #1a191d; --surface-2: #242328; --line: #333138;
    --ink: #f1eff4; --ink-2: #bab7c2; --ink-3: #87848f;
    --accent: var(--acc-d); --on-accent: #111013; --scope-bg: #0a090b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111013; --surface: #1a191d; --surface-2: #242328; --line: #333138;
  --ink: #f1eff4; --ink-2: #bab7c2; --ink-3: #87848f;
  --accent: var(--acc-d); --on-accent: #111013; --scope-bg: #0a090b;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.65; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 36px 20px 72px; display: grid; gap: 28px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.site-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
.site-head h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 6vw, 52px); margin: 0; line-height: 1.1; }
.site-head p { margin: 0; color: var(--ink-2); max-width: 52ch; font-size: 14px; }

.layout { display: grid; grid-template-columns: minmax(250px, 320px) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

.tracks { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 860px) { .tracks { position: static; } }
.tracks-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); padding: 0 10px 6px; font-family: var(--font-mono); }
.track { width: 100%; font: inherit; text-align: left; border: 0; background: none; color: var(--ink); cursor: pointer; display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 0 10px; align-items: center; padding: 10px; border-radius: 8px; }
.track:hover { background: var(--surface-2); }
.track[aria-current="true"] { background: var(--surface); box-shadow: inset 3px 0 0 var(--tc); }
.track .no { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
.track .t { font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.track .g { grid-column: 2; font-size: 12px; color: var(--ink-3); }
.track .len { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); grid-row: 1; grid-column: 3; }
.track .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tc); display: inline-block; margin-right: 6px; vertical-align: 1px; }
.track.playing .len::before { content: "♪ "; color: var(--tc); }

.main { display: grid; gap: 28px; min-width: 0; }
.hero { display: grid; gap: 8px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase; }
.hero h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(40px, 8vw, 72px); line-height: 1.05; margin: 0; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--font-mono); font-size: 13px; color: var(--ink-2); }
.lede { margin: 2px 0 0; color: var(--ink-2); max-width: 62ch; }

.player { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 16px; }
.scope { width: 100%; height: 96px; display: block; background: var(--scope-bg); border-radius: 6px; }
.transport { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
.play { width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); cursor: pointer; display: grid; place-items: center; flex: none; }
.play svg { width: 24px; height: 24px; fill: currentColor; }
.play:hover { filter: brightness(1.07); }
.btn { font: inherit; font-size: 13px; background: none; border: 1px solid var(--line); color: var(--ink-2); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.btn:hover { border-color: var(--accent); color: var(--ink); }
.now { display: grid; min-width: 0; flex: 1 1 180px; }
.now .sec { font-size: 12px; color: var(--ink-3); letter-spacing: .05em; }
.now .chord { font-family: var(--font-display); font-size: clamp(26px, 5vw, 36px); line-height: 1.2; overflow-wrap: anywhere; }
.clock { font-family: var(--font-mono); font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.steps { display: grid; grid-template-columns: repeat(16, 1fr); gap: 4px; }
.steps i { height: 6px; border-radius: 2px; background: var(--surface-2); }
.steps i:nth-child(4n+1) { background: var(--line); }
.steps i.on { background: var(--accent); }
.timeline { display: flex; gap: 3px; height: 42px; }
.seg { position: relative; border: 0; padding: 0 8px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 12px; text-align: left; color: var(--ink); background: var(--surface-2); overflow: hidden; min-width: 0; }
.seg::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--accent); opacity: var(--o, .5); }
.seg span { position: relative; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg.cur { background: var(--accent-soft); font-weight: 500; }
.seg .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); opacity: .16; width: 0; pointer-events: none; }
.note { font-size: 12px; color: var(--ink-3); margin: -6px 0 0; }
.mixer { display: flex; flex-wrap: wrap; gap: 8px; }
.part { font: inherit; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 12px 5px 8px; cursor: pointer; }
.part .led { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); transition: transform .08s; }
.part[aria-pressed="false"] { color: var(--ink-3); }
.part[aria-pressed="false"] .led { background: var(--surface-2); }
.part.hit .led { transform: scale(1.5); }
.err { color: #c0392b; font-size: 13px; margin: 0; }

h3 { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 0; }
.block { display: grid; gap: 12px; }
.rows { display: grid; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 9em minmax(0, 1fr) minmax(0, 14em); gap: 6px 18px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.row .what { font-weight: 700; }
.row .what small { display: block; font-weight: 400; font-size: 12px; color: var(--ink-3); font-family: var(--font-mono); }
.row .how { color: var(--ink-2); }
.row .src { display: flex; flex-wrap: wrap; gap: 4px 6px; align-content: start; }
.tag { font-size: 12px; border-radius: 4px; padding: 1px 7px; background: var(--surface-2); white-space: nowrap; }
.tag b { font-family: var(--font-mono); font-weight: 500; margin-left: 4px; color: var(--ink-2); }
@media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
.chart-sheet { overflow-x: auto; }
.sheet { font-family: var(--font-mono); font-size: 13px; border-collapse: collapse; min-width: 560px; width: 100%; }
.sheet th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 12px; padding: 5px 10px 5px 0; white-space: nowrap; }
.sheet td { padding: 5px 10px; border-left: 1px solid var(--line); white-space: nowrap; }
footer { font-size: 12px; color: var(--ink-3); }
footer p { margin: 0; max-width: 76ch; }
@media (prefers-reduced-motion: reduce) { .part .led { transition: none; } }
</style>

<div class="wrap">
  <header class="site-head">
    <h1>履歴盤</h1>
    <p>Spotify の再生履歴（2016〜2026年、約1,290時間）をもとに作ったオリジナル曲の置き場です。音はすべてこのページの中のシンセサイザーで鳴らしています。</p>
  </header>

  <div class="layout">
    <nav aria-label="曲の一覧">
      <div class="tracks-head"><span id="count"></span><span>長さ</span></div>
      <ol class="tracks" id="tracks"></ol>
    </nav>

    <main class="main">
      <section class="hero">
        <div class="eyebrow" id="eyebrow"></div>
        <h2 id="title"></h2>
        <div class="meta" id="meta"></div>
        <p class="lede" id="blurb"></p>
      </section>

      <section class="player" aria-label="プレイヤー">
        <canvas class="scope" id="scope" aria-hidden="true"></canvas>
        <div class="transport">
          <button class="play" id="play" type="button" aria-label="再生">
            <svg id="icon-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>
            <svg id="icon-pause" viewBox="0 0 24 24" hidden><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>
          </button>
          <div class="now"><span class="sec" id="now-sec"></span><span class="chord" id="now-chord"></span></div>
          <span class="clock" id="clock"></span>
          <button class="btn" id="rewind" type="button">最初から</button>
        </div>
        <div class="steps" id="steps" aria-hidden="true"></div>
        <div class="timeline" id="timeline"></div>
        <p class="note">区間を押すとそこから再生します。</p>
        <div class="mixer" id="mixer"></div>
        <p class="err" id="err" hidden></p>
      </section>

      <section class="block">
        <h3>この曲に入れたもの</h3>
        <div class="rows" id="why"></div>
      </section>
      <section class="block">
        <h3>コード譜</h3>
        <div class="chart-sheet"><table class="sheet" id="sheet"></table></div>
      </section>
      <footer>
        <p>既存曲のメロディやフレーズは使っていません。解説の時間は全期間の再生時間です。音源は Tone.js で合成しています。スマホで音が出ない場合は、マナーモード（消音スイッチ）を解除してください。</p>
      </footer>
    </main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script>
const SONGS = [];
/*__SONGS__*/
</script>
<script>
(() => {
const $ = id => document.getElementById(id);
const fmtT = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
SONGS.sort((a, b) => a.no - b.no);

// ---------- song geometry ----------
function geometry(song) {
  const BAR = 240 / song.bpm, S = BAR / 16, swing = song.swing || 0;
  const BARS = [];
  song.sections.forEach((s, si) => {
    s.start = BARS.length;
    for (let i = 0; i < s.bars; i++) BARS.push({ sec: s, si, local: i, chord: song.chords[s.chords[i % s.chords.length]] });
  });
  const END = BARS.length * BAR + (song.tail ?? 4);
  return { BAR, S, swing, BARS, END };
}
SONGS.forEach(s => { s.geo = geometry(s); });

// ---------- shared kit for song builders ----------
function makeKit(song, transport, hitCb) {
  const { BAR, S, swing, BARS, END } = song.geo;
  const master = new Tone.Gain(song.masterGain ?? 0.8);
  const comp = new Tone.Compressor({ threshold: -18, ratio: 3.5, attack: 0.006, release: 0.18, ...(song.comp || {}) });
  const limiter = new Tone.Limiter(-1.5);
  const scope = new Tone.Waveform(1024);
  master.chain(comp, limiter, Tone.getDestination());
  limiter.connect(scope);
  const ch = {};
  // per-song send buses (Tone.Channel.send/receive use a global registry that breaks after a context swap)
  const buses = {};
  const busIn = name => buses[name] || (buses[name] = new Tone.Gain(1));
  return {
    BAR, S, BARS, END, master, scope, ch,
    T: (bar, step) => bar * BAR + step * S + (swing && Math.floor(step) % 2 && step % 1 === 0 ? swing * S : 0),
    D: steps => steps * S,
    m: n => Tone.Frequency(n).toMidi(),
    f: midi => Tone.Frequency(midi, "midi").toNote(),
    at: (time, fn) => transport.schedule(fn, time),
    human: (amt = 0.005) => (Math.random() * 2 - 1) * amt,
    flash: (part, time) => { const cb = hitCb[part]; if (cb) Tone.Draw.schedule(cb, time); },
    channel(name, volume, sends = {}) {
      const c = new Tone.Channel({ volume }).connect(master);
      for (const [bus, db] of Object.entries(sends)) c.connect(new Tone.Gain(Tone.dbToGain(db)).connect(busIn(bus)));
      return (ch[name] = c);
    },
    bus(name, volume, ...fx) {
      const c = new Tone.Channel({ volume });
      busIn(name).connect(c);
      c.chain(...fx, master);
      return c;
    },
    shaper: levels => new Tone.WaveShaper(x => Math.round(x * levels) / levels, 4096),
  };
}

// ---------- state ----------
let cur = null;        // current song
let G = null;          // built graph {kit, api}
let starting = null, busy = false;
const muted = {};
const hitCb = {};

// ---------- track list ----------
const tracks = $("tracks");
$("count").textContent = `${SONGS.length}曲`;
SONGS.forEach(s => {
  const li = document.createElement("li");
  li.innerHTML = `<button class="track" type="button" id="track-${s.id}" style="--tc:${s.accent.light}">
    <span class="no">${String(s.no).padStart(2, "0")}</span>
    <span class="t">${esc(s.title)}</span>
    <span class="len">${fmtT(s.geo.END)}</span>
    <span class="g"><span class="dot"></span>${esc(s.genre)}</span>
  </button>`;
  li.firstElementChild.addEventListener("click", () => select(s.id, true));
  tracks.appendChild(li);
});
function trackColors() {
  const dark = document.documentElement.dataset.theme === "dark" || (document.documentElement.dataset.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  SONGS.forEach(s => $("track-" + s.id).style.setProperty("--tc", dark ? s.accent.dark : s.accent.light));
}
trackColors();
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", trackColors); } catch {}
new MutationObserver(trackColors).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

const stepsEl = $("steps");
for (let i = 0; i < 16; i++) stepsEl.appendChild(document.createElement("i"));

// ---------- select / render song page ----------
async function select(id, autoplay) {
  const song = SONGS.find(s => s.id === id) || SONGS[SONGS.length - 1];
  if (cur === song) { if (autoplay && !(G && Tone.Transport.state === "started")) toggle(); return; }
  await teardown();
  cur = song;
  for (const k in muted) delete muted[k];
  try { if (location.hash !== "#" + song.id) history.replaceState(null, "", "#" + song.id); } catch {}
  const root = document.documentElement.style;
  root.setProperty("--acc-l", song.accent.light); root.setProperty("--acc-d", song.accent.dark);
  SONGS.forEach(s => $("track-" + s.id).setAttribute("aria-current", String(s === song)));
  $("eyebrow").textContent = `No.${String(song.no).padStart(2, "0")} · ${song.genre} · ${song.date}`;
  $("title").textContent = song.title;
  $("meta").innerHTML = [`${song.bpm} BPM`, song.key, song.meter || "4/4", fmtT(song.geo.END), "インスト"].map(x => `<span>${esc(x)}</span>`).join("");
  $("blurb").textContent = song.blurb;
  document.title = `${song.title} — 履歴盤`;

  const tl = $("timeline"); tl.innerHTML = "";
  song.sections.forEach(s => {
    const b = document.createElement("button");
    b.className = "seg"; b.type = "button"; b.id = "seg-" + s.id;
    b.style.flex = `${s.bars} 1 0`; b.style.setProperty("--o", s.intensity ?? 0.5);
    b.innerHTML = `<div class="fill"></div><span>${esc(s.name)}</span>`;
    b.title = `${s.name}（${s.bars}小節）`;
    b.addEventListener("click", () => seek(s.start * song.geo.BAR, true));
    tl.appendChild(b);
  });
  const mixer = $("mixer");
  mixer.innerHTML = "";
  song.parts.forEach(([k, label]) => {
    const b = document.createElement("button");
    b.className = "part"; b.type = "button"; b.id = "part-" + k;
    b.setAttribute("aria-pressed", "true");
    b.innerHTML = `<span class="led"></span>${esc(label)}`;
    b.addEventListener("click", () => { muted[k] = !muted[k]; b.setAttribute("aria-pressed", String(!muted[k])); if (G && G.kit.ch[k]) G.kit.ch[k].mute = muted[k]; });
    mixer.appendChild(b);
    hitCb[k] = () => { b.classList.add("hit"); setTimeout(() => b.classList.remove("hit"), 90); };
  });
  $("why").innerHTML = song.why.map(([w, sub, how, src]) => `<div class="row">
    <div class="what">${esc(w)}<small>${esc(sub)}</small></div>
    <div class="how">${esc(how)}</div>
    <div class="src">${src.map(([n, h]) => `<span class="tag">${esc(n)}${h != null ? `<b>${h}h</b>` : ""}</span>`).join("")}</div>
  </div>`).join("");
  $("sheet").innerHTML = song.sections.map(s => {
    const row = []; for (let i = 0; i < s.bars; i++) row.push(s.chords[i % s.chords.length]);
    const lines = []; for (let i = 0; i < row.length; i += 8) lines.push(row.slice(i, i + 8));
    return lines.map((r, ri) => `<tr><th>${ri === 0 ? esc(s.name) : ""}</th>${r.map(c => `<td>${esc(song.chords[c].sym)}</td>`).join("")}${"<td></td>".repeat(8 - r.length)}</tr>`).join("");
  }).join("");
  $("err").hidden = true;
  lastKey = ""; draw(true);
  if (autoplay) toggle();
}

async function teardown() {
  if (!G && !starting) return;
  try { await starting; } catch {}
  try { Tone.Transport.stop(); Tone.Transport.cancel(0); } catch {}
  const old = Tone.getContext();
  G = null; starting = null;
  Tone.setContext(new Tone.Context());
  try { old.dispose(); } catch {}
  setPlaying(false); lastPlaying = false;
}

async function ensure() {
  if (G) return G;
  if (!starting) starting = (async () => {
    await Tone.start();
    const tr = Tone.Transport;
    tr.cancel(0); tr.bpm.value = cur.bpm; tr.seconds = 0;
    const kit = makeKit(cur, tr, hitCb);
    const api = cur.build(tr, kit) || {};
    for (const [k] of cur.parts) if (kit.ch[k]) kit.ch[k].mute = !!muted[k];
    tr.schedule(t => Tone.Draw.schedule(() => { tr.stop(); tr.seconds = 0; release(); }, t), kit.END);
    G = { kit, api };
    return G;
  })();
  return starting;
}
function release() { try { G && G.api.releaseAll && G.api.releaseAll(); } catch {} }
function setPlaying(p) { $("icon-play").toggleAttribute("hidden", p); $("icon-pause").toggleAttribute("hidden", !p); $("play").setAttribute("aria-label", p ? "一時停止" : "再生"); }

async function toggle() {
  if (busy) return;
  try {
    busy = true;
    if (!G) $("now-sec").textContent = "音源を準備しています…";
    await ensure();
    const tr = Tone.Transport;
    if (tr.state === "started") { tr.pause(); release(); setPlaying(false); }
    else { tr.start("+0.05"); setPlaying(true); }
  } catch (e) { showErr(e); }
  finally { busy = false; lastKey = ""; }
}
async function seek(sec, autoplay) {
  if (busy) return;
  try {
    busy = true;
    await ensure();
    release();
    Tone.Transport.seconds = sec;
    if (autoplay && Tone.Transport.state !== "started") { Tone.Transport.start("+0.05"); setPlaying(true); }
  } catch (e) { showErr(e); }
  finally { busy = false; lastKey = ""; }
}
function showErr(e) { const el = $("err"); el.hidden = false; el.textContent = "音を鳴らせませんでした（" + (e && e.message || e) + "）。ページを再読み込みしてもう一度お試しください。"; }
$("play").addEventListener("click", toggle);
$("rewind").addEventListener("click", () => seek(0, false));

// ---------- scope + UI loop ----------
const cv = $("scope"), cx = cv.getContext("2d");
function sizeScope() { const r = cv.getBoundingClientRect(); cv.width = Math.max(1, Math.round(r.width * devicePixelRatio)); cv.height = Math.max(1, Math.round(r.height * devicePixelRatio)); }
sizeScope(); addEventListener("resize", sizeScope);
function drawScope(playing) {
  const w = cv.width, h = cv.height;
  cx.clearRect(0, 0, w, h);
  cx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#d98a1e";
  cx.lineWidth = 2 * devicePixelRatio;
  cx.beginPath();
  const data = playing && G ? G.kit.scope.getValue() : null;
  const n = data ? data.length : 2;
  for (let i = 0; i < n; i++) { const x = i / (n - 1) * w, y = h / 2 - (data ? data[i] : 0) * h * 0.45; i ? cx.lineTo(x, y) : cx.moveTo(x, y); }
  cx.stroke();
}
let lastKey = "", lastPlaying = false;

(function loop() { draw(false); requestAnimationFrame(loop); })();

const initial = (location.hash || "").slice(1);

window.RIREKI = { SONGS, geometry, makeKit };
})();
